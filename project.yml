name: DataMatrixScanner
options:
  bundleIdPrefix: com.cel.datamatrixscanner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages: {}

targets:
  DataMatrixScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DataMatrixScanner
    resources:
      - path: DataMatrixScanner/Resources
        optional: true
    info:
      path: DataMatrixScanner/Info.plist
      properties:
        CFBundleDisplayName: DataMatrix Grid Scanner
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Scan Data Matrix codes from a printed grid."
        NSPhotoLibraryUsageDescription: "Import photos containing Data Matrix code grids."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cel.datamatrixscanner
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  DataMatrixScannerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DataMatrixScannerTests
    dependencies:
      - target: DataMatrixScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cel.datamatrixscanner.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DataMatrixScanner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DataMatrixScanner"

schemes:
  DataMatrixScanner:
    build:
      targets:
        DataMatrixScanner: all
        DataMatrixScannerTests: [test]
    test:
      targets:
        - DataMatrixScannerTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
